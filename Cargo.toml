[package]
name = "youtube-helper-rs"
version = "0.1.4"
edition = "2021"
# Verified, not guessed: `cargo test --all` passes on 1.85.0. Floor set by the oldest toolchain this crate is tested against.
rust-version = "1.85"
description = "Rust wrapper around the yt-dlp binary: video metadata and audio downloads, no reimplementation of yt-dlp itself."
authors = ["Warith HARCHAOUI <warithmetics@deraison.ai>"]
license = "BSD-3-Clause"
repository = "https://github.com/warith-harchaoui/youtube-helper-rs"
homepage = "https://deraison.ai/ai-helpers"
documentation = "https://docs.rs/youtube-helper-rs"
readme = "README.md"
keywords = ["youtube", "yt-dlp", "video", "audio", "download"]
categories = ["multimedia", "api-bindings"]

[features]
# On by default so `cargo install youtube-helper-rs` produces the binary. Library users
# who want clap out of their dependency graph depend on this crate with
# `default-features = false`.
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# CLI-only, behind the `cli` feature below: a library consumer should not pay
# for an argument parser it never calls. `derive` keeps the argument
# definitions next to the types they fill.
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
# Named after the crate, not after the Python twin's `youtube-helper`: the two
# are meant to coexist on one machine, and identical names would make PATH
# order decide which one runs.
name = "youtube-helper-rs"
path = "src/main.rs"
required-features = ["cli"]
