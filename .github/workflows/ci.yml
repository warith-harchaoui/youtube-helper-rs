name: CI

# Rigorous, blocking CI (house rule 14): a red build cannot merge. Format, lint, and test
# on all three desktop OSes so the "runs everywhere" promise is checked, not assumed.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Treat warnings as errors everywhere, not just in the clippy step.
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      # Formatting is a fast, deterministic gate — run it first so a whitespace slip fails
      # in seconds rather than after a full build.
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (unit + integration + doc-tests)
        run: cargo test --all
