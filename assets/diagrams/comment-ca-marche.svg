<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1237 432" width="1237" height="432" role="img" aria-labelledby="yhrf-title yhrf-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="yhrf-title">Comment youtube-helper-rs fonctionne : une URL en entrée, des valeurs Rust typées en sortie, le binaire yt-dlp approvisionné plutôt que seulement exigé</title>
  <desc id="yhrf-desc">Une planche qui se lit de gauche à droite. Entrée : une URL média venant de n'importe quel hôte connu de yt-dlp. Le travail, en trois étapes numérotées : le binaire est trouvé, dans un ordre fixe qui préfère une variable d'environnement explicite, puis le PATH, puis une copie mise en cache plus tôt, et seulement alors télécharge la version autonome officielle ; yt-dlp est invoqué comme sous-processus, sans qu'aucune de ses logiques d'extraction ne soit réimplémentée ici ; enfin sa sortie est analysée en valeurs typées. Sortie : des métadonnées, un fichier audio téléchargé, ou une URL de flux résolue — cette dernière étant la seule des trois qui fonctionne sur une diffusion en direct, laquelle ne finit jamais de se télécharger. Dessous, un seul crate qui interdit le code unsafe hors de ses propres tests puis documente chaque élément public. On l'atteint par trois surfaces : une API Rust, une ligne de commande clap derrière une option de compilation, puis un skill d'agent. La légende rappelle comment désactiver le téléchargement automatique.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="yhrf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="168" height="78" rx="10"/>
  <text class="n-title" x="112" y="120" text-anchor="middle">une URL média</text>
  <text class="n-sub" x="112" y="139" text-anchor="middle">tout hôte connu de yt-dlp</text>
  <path class="flow" d="M202 126 H218" marker-end="url(#yhrf-arrow)"/>
  <rect class="panel" x="222" y="54" width="772" height="144" rx="12"/>
  <text class="panel-label" x="242" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="242" y="94" width="206" height="78" rx="10"/>
  <text class="n-title" x="345" y="127" text-anchor="middle">trouver le binaire</text>
  <text class="n-sub" x="345" y="146" text-anchor="middle">env, PATH, cache, puis téléchargement</text>
  <text class="step" x="253" y="110">1</text>
  <path class="flow" d="M452 133 H468" marker-end="url(#yhrf-arrow)"/>
  <rect class="stage" x="474" y="94" width="256" height="78" rx="10"/>
  <text class="n-title" x="602" y="127" text-anchor="middle">invoquer yt-dlp</text>
  <text class="n-sub" x="602" y="146" text-anchor="middle">un sous-processus, rien de réécrit</text>
  <text class="step" x="485" y="110">2</text>
  <path class="flow" d="M734 133 H750" marker-end="url(#yhrf-arrow)"/>
  <rect class="stage" x="756" y="94" width="218" height="78" rx="10"/>
  <text class="n-title" x="865" y="127" text-anchor="middle">analyser la sortie</text>
  <text class="n-sub" x="865" y="146" text-anchor="middle">en valeurs typées</text>
  <text class="step" x="767" y="110">3</text>
  <path class="flow" d="M1000 126 H1016" marker-end="url(#yhrf-arrow)"/>
  <text class="panel-label" x="1020" y="40">SORTIE</text>
  <rect class="io" x="1020" y="87" width="189" height="78" rx="10"/>
  <text class="n-title" x="1114" y="120" text-anchor="middle">métadonnées ou média</text>
  <text class="n-sub" x="1114" y="139" text-anchor="middle">un fichier, ou une URL de flux</text>
  <rect class="core" x="392" y="232" width="432" height="54" rx="10"/>
  <text class="on-dark" x="608" y="253" text-anchor="middle">un seul crate, aucun unsafe, tout documenté</text>
  <text class="on-dark-sub" x="608" y="272" text-anchor="middle">jamais d'installation système, seulement le cache</text>
  <path class="tie" d="M608 286 V314 H408 V332"/>
  <path class="tie" d="M608 314 H808 V332"/>
  <path class="tie" d="M608 314 V332"/>
  <rect class="surface" x="318" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="408" y="360" text-anchor="middle">API Rust</text>
  <rect class="surface" x="518" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="608" y="360" text-anchor="middle">CLI (clap, en option)</text>
  <rect class="surface" x="718" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="808" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="608" y="412" text-anchor="middle">Mettez YOUTUBE_HELPER_NO_AUTO_INSTALL=1 là où un appel réseau non annoncé à l'exécution est inacceptable : l'ancienne erreur BinaryNotFound revient, inchangée.</text>
</svg>
