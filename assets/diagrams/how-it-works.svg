<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1237 432" width="1237" height="432" role="img" aria-labelledby="yhr-title yhr-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="yhr-title">How youtube-helper-rs works: a URL in, typed Rust values out, with the yt-dlp binary provisioned rather than merely required</title>
  <desc id="yhr-desc">A left-to-right plate. In: a media URL from any host yt-dlp knows. The work, in three numbered stages: the binary is found, in a fixed order that prefers an explicit environment variable, then PATH, then a copy cached earlier, and only then downloads the official standalone build; yt-dlp is invoked as a subprocess, with none of its extraction logic reimplemented here; and its output is parsed into typed values. Out: metadata, a downloaded audio file, or a resolved stream URL — the last being the only one of the three that works on a live broadcast, which never finishes downloading. Underneath, one crate that forbids unsafe code outside its own tests and documents every public item. It is reached through three surfaces: a Rust API, a clap command line behind an opt-in feature, and an agent skill. The caption records how to turn the automatic download off.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="yhr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="168" height="78" rx="10"/>
  <text class="n-title" x="112" y="120" text-anchor="middle">a media URL</text>
  <text class="n-sub" x="112" y="139" text-anchor="middle">any host yt-dlp knows</text>
  <path class="flow" d="M202 126 H218" marker-end="url(#yhr-arrow)"/>
  <rect class="panel" x="222" y="54" width="772" height="144" rx="12"/>
  <text class="panel-label" x="242" y="76">WHAT IT DOES</text>
  <rect class="stage" x="242" y="94" width="216" height="78" rx="10"/>
  <text class="n-title" x="350" y="127" text-anchor="middle">find the binary</text>
  <text class="n-sub" x="350" y="146" text-anchor="middle">env, PATH, cache, then download</text>
  <text class="step" x="253" y="110">1</text>
  <path class="flow" d="M462 133 H478" marker-end="url(#yhr-arrow)"/>
  <rect class="stage" x="484" y="94" width="252" height="78" rx="10"/>
  <text class="n-title" x="610" y="127" text-anchor="middle">invoke yt-dlp</text>
  <text class="n-sub" x="610" y="146" text-anchor="middle">a subprocess, nothing reimplemented</text>
  <text class="step" x="495" y="110">2</text>
  <path class="flow" d="M740 133 H756" marker-end="url(#yhr-arrow)"/>
  <rect class="stage" x="762" y="94" width="212" height="78" rx="10"/>
  <text class="n-title" x="868" y="127" text-anchor="middle">parse the output</text>
  <text class="n-sub" x="868" y="146" text-anchor="middle">into typed values</text>
  <text class="step" x="773" y="110">3</text>
  <path class="flow" d="M1000 126 H1016" marker-end="url(#yhr-arrow)"/>
  <text class="panel-label" x="1020" y="40">OUT</text>
  <rect class="io" x="1020" y="87" width="189" height="78" rx="10"/>
  <text class="n-title" x="1114" y="120" text-anchor="middle">metadata or media</text>
  <text class="n-sub" x="1114" y="139" text-anchor="middle">a file, or a stream URL</text>
  <rect class="core" x="392" y="232" width="432" height="54" rx="10"/>
  <text class="on-dark" x="608" y="253" text-anchor="middle">one crate, no unsafe, every item documented</text>
  <text class="on-dark-sub" x="608" y="272" text-anchor="middle">never installs system-wide, only the user cache</text>
  <path class="tie" d="M608 286 V314 H408 V332"/>
  <path class="tie" d="M608 314 H808 V332"/>
  <path class="tie" d="M608 314 V332"/>
  <rect class="surface" x="318" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="408" y="360" text-anchor="middle">Rust API</text>
  <rect class="surface" x="518" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="608" y="360" text-anchor="middle">CLI (clap, opt-in)</text>
  <rect class="surface" x="718" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="808" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="608" y="412" text-anchor="middle">Set YOUTUBE_HELPER_NO_AUTO_INSTALL=1 where an unannounced network call at runtime is unacceptable: the old BinaryNotFound error comes back, unchanged.</text>
</svg>
